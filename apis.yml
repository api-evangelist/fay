name: Fay
description: 'Fay (Fay Health, Inc.) is a digital-health marketplace that connects members
  with registered dietitians and nutritionists and handles the insurance billing so
  nutrition counseling is covered — often at little or no out-of-pocket cost. The platform
  offers telehealth consultations, personalized meal planning, and support for chronic
  condition management, backed by iOS and Android apps and a member help center. Fay
  reports 4,000+ registered dietitians, 700+ accepted insurance plans, and 100,000+
  members. It is backed by Forerunner Ventures and General Catalyst and is tracked in
  the API Evangelist network as a portfolio-lead company profile; Fay publishes no public
  developer or API surface at this time.'
